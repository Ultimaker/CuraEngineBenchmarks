<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
      }
      h1 {
        text-align: center;
        font-size: 2.5rem;
        font-weight: 600;
        margin: 32px 0 24px;
      }
      .back {
        display: inline-block;
        margin-bottom: 16px;
        color: #3273dc;
        text-decoration: none;
        font-size: 0.95rem;
      }
      .back:hover {
        color: #000;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0 auto;
        max-width: 480px;
      }
      li {
        margin: 12px 0;
      }
      a.entry {
        display: flex;
        align-items: center;
        padding: 14px 20px;
        background-color: #f5f5f5;
        border: 1px solid #dbdbdb;
        border-radius: 4px;
        color: #3273dc;
        text-decoration: none;
        font-size: 1.1rem;
      }
      .entry-thumbnail {
        flex: none;
        width: 64px;
        height: 64px;
        margin-right: 16px;
        object-fit: contain;
      }
      .entry-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        word-break: break-word;
      }
      .entry-description {
        margin-top: 2px;
        color: #7a7a7a;
        font-size: 0.85rem;
      }
      a.entry:hover {
        background-color: #eef3fb;
        border-color: #3273dc;
        color: #000;
      }
    </style>
    <title>Profiles Benchmarks</title>
  </head>
  <body>
    <a class="back" href="../">&larr; Back to all benchmarks</a>
    <h1>Profiles Benchmarks</h1>
    <ul id="list"></ul>

    <script>
      'use strict';
      (function () {
        var list = document.getElementById('list');

        function render(folders) {
          list.innerHTML = '';
          if (folders.length === 0) {
            var li = document.createElement('li');
            li.textContent = 'No profiles available yet.';
            list.appendChild(li);
            return;
          }
          folders.forEach(function (name) {
            var li = document.createElement('li');
            var base = encodeURIComponent(name) + '/';
            var a = document.createElement('a');
            a.className = 'entry';
            a.href = base;

            var img = document.createElement('img');
            img.className = 'entry-thumbnail';
            img.alt = '';
            img.hidden = true;
            img.onload = function () { img.hidden = false; };
            img.onerror = function () { img.remove(); };
            img.src = base + 'thumbnail.png';
            a.appendChild(img);

            var text = document.createElement('span');
            text.className = 'entry-text';
            var title = document.createElement('span');
            title.className = 'entry-title';
            title.textContent = name;
            text.appendChild(title);
            a.appendChild(text);

            li.appendChild(a);
            list.appendChild(li);

            fetch(base + 'metadata.json')
              .then(function (r) {
                if (!r.ok) { throw new Error('HTTP ' + r.status); }
                return r.json();
              })
              .then(function (metadata) {
                var printerName = metadata && metadata.printer_name;
                if (typeof printerName !== 'string' || printerName.trim() === '') { return; }
                var desc = document.createElement('span');
                desc.className = 'entry-description';
                desc.textContent = printerName;
                text.appendChild(desc);
              })
              .catch(function () {
                // Metadata is optional, silently ignore missing or invalid files
              });
          });
        }

        fetch('https://api.github.com/repos/Ultimaker/CuraEngineBenchmarks/contents/dev/profiles_bench?ref=main')
          .then(function (r) {
            if (!r.ok) { throw new Error('HTTP ' + r.status); }
            return r.json();
          })
          .then(function (items) {
            var dirs = items
              .filter(function (item) { return item.type === 'dir'; })
              .map(function (item) { return item.name; });
            render(dirs);
          })
          .catch(function () {
            list.innerHTML = '<li>Failed to load profiles list.</li>';
          });
      })();
    </script>
  </body>
</html>
